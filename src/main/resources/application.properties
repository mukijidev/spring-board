spring.application.name=spring-board

# Local Docker MySQL (must match compose.yaml: port, database, user)
spring.datasource.url=jdbc:mysql://localhost:3307/board
spring.datasource.username=board
spring.datasource.password=board

# Tables are created by Flyway. Hibernate only checks that entities match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.data.web.pageable.max-page-size=50